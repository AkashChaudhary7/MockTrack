<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#4F46E5" />
    <meta name="application-name" content="MockTrack" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MockTrack" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />

    <!-- Google Fonts: Bricolage Grotesque (stylish expressive display) + Outfit + Plus Jakarta Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />

    <meta property="og:title" content="MockTrack — Exam Score Tracker & Performance Center" />
    <meta property="og:description" content="Offline-first personal mock test score tracker, subject weakness analyzer, AI scorecard OCR reader, and rank command center." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <script>
      // Clear stale service worker caches on development/preview instances
      if ('serviceWorker' in navigator && (location.hostname.includes('run.app') || location.hostname === 'localhost')) {
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) {
              if (keys[i].indexOf('mocktrack-static-v5') === -1 && keys[i].indexOf('mocktrack-data-v5') === -1) {
                caches.delete(keys[i]);
              }
            }
          });
        }
      }
    </script>
  </head>
  <body class="bg-[#FAF9F6] dark:bg-[#0A0E17] text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
